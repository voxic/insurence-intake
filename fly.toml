# Single-instance public demo. Do not scale this process above 1 machine:
# backoffice state and transcripts are JSON files on one volume.
app = "insurence-intake"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  NEXT_INTERNAL_PORT = "4317"
  MCP_HOST = "127.0.0.1"
  MCP_PORT = "4318"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  hard_limit = 50
  soft_limit = 25

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "45s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[mounts]
  source = "acme_intake_data"
  destination = "/data"
